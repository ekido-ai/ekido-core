name: Tests

# ekido-core holds the shared library, the API contract and the evidence. Each service tests itself in its own repo
# (ekido-coordinator, ekido-platform, ekido-workers, ekido-inference, ekido-web, ekido-contracts, ekido-infra).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            dir: packages/ekido_core
            path: "."
          - suite: experiments
            dir: experiments
            path: "."
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors numpy eth-account eth-utils jsonschema "pyyaml==6.0.2" "pyrage>=1.4,<2"
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        env:
          PYTHONPATH: ${{ matrix.path }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
