name: Gate

# The shared merge gate for every Ekido repo: the PR report ("no report, no merge") and a conventional PR title.
# Other repos call it with:  uses: ekido-ai/ekido-core/.github/workflows/gate.yml@main
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: PR report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ekido-ai/ekido-core
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the report sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python .github/scripts/pr_report.py
      # Commits and PRs carry no AI-tool credit lines. A squash merge copies every commit message into main, so one
      # stray trailer in a branch ends up in the permanent history; this stops it before the merge.
      - name: No AI tool credit in commits or description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pattern='co-authored-by:.*(cl[a]ude|anthr[o]pic)|noreply@anthr[o]pic\.com|generated with \[?cl[a]ude|cl[a]ude\.ai/code'
          found=0
          if printf '%s' "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "::error::The PR description credits an AI tool. Remove that line."
            found=1
          fi
          gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | .sha[0:7] + " " + (.commit.message | gsub("\n"; " ")) + " <" + .commit.author.email + "> <" + .commit.committer.email + ">"' > commits.txt
          if grep -Ei "$pattern" commits.txt; then
            echo "::error::A commit above credits an AI tool. Reword it (git commit --amend, or git rebase -i for older ones) and push again."
            found=1
          fi
          exit $found

  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            revert
